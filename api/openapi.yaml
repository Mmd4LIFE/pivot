openapi: 3.1.0

# This spec is the source of truth for Pivot's HTTP surface.
#
# The UI is a client of this API, not a privileged caller (architectural rule
# 2), so anything the frontend can do is described here. The TypeScript client
# is generated from this file — see `make gen-client` — which means an endpoint
# that is not documented here is one the frontend cannot call.
#
# Handlers are added here first, then implemented. That ordering is what stops
# the public API becoming an afterthought shaped by whatever the UI happened to
# need.

info:
  title: Pivot API
  version: 0.1.0
  summary: The open business intelligence platform for the AI era.
  description: |
    Every non-2xx response uses the same error envelope, carrying a stable
    machine-readable `code`. Codes never change meaning and are never reused,
    so a client may branch on them safely.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Pivot
    url: https://github.com/Mmd4LIFE/pivot

servers:
  - url: /
    description: This instance

tags:
  - name: health
    description: Liveness and readiness probes
  - name: auth
    description: Login, logout, and session management
  - name: authorization
    description: Roles and role assignment
  - name: sso
    description: Single sign-on and identity providers
  - name: system
    description: Instance metadata

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and open a session
      description: |
        On success the session token is set as an `HttpOnly`, `SameSite=Lax`
        cookie. It is **not** returned in the body: putting it there would
        hand it to any script on the page, which is what `HttpOnly` exists to
        prevent.

        The `Secure` attribute is set on any TLS request, and otherwise only
        when `auth.cookieSecure` is configured — a browser discards a `Secure`
        cookie sent over plain HTTP, which would break a local install. Behind
        a proxy that terminates TLS, set that option.

        Every failure returns `PIVOT-AUTH-001` with the same message and at
        the same cost, whether the account is unknown, the password is wrong,
        or the account is disabled. Distinguishing them — in the body or in
        the timing — tells an attacker which addresses are real.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The session cookie, `HttpOnly` and `SameSite=Lax`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          description: |
            Throttled, or the account is locked after repeated failures. The
            two are the same status and different codes — `PIVOT-RATE-001`
            means "slow down", `PIVOT-AUTH-005` means "this account is locked"
            — and they call for different handling, so branch on the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Revokes the session immediately: the very next request carrying the
        token is rejected, with no window to wait out. That immediacy is why
        sessions are server-side rather than stateless tokens.

        Succeeds whether or not a valid session was present. The caller asked
        to be logged out, and they are.
      security: []
      responses:
        "204":
          description: Logged out; the session cookie is cleared

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The authenticated user and session
      responses:
        "200":
          description: The caller's identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: The caller's own active sessions
      description: |
        Returns only the caller's sessions, never anyone else's. The one
        making this request is marked `current`.
      responses:
        "200":
          description: Active sessions, most recent activity first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: End one of the caller's own sessions
      description: |
        Scoped to the caller, not merely to their organization: naming another
        member's session returns 404 rather than ending it.

        Revoking the session making the request is a logout, and clears the
        cookie.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Reports only that the process is running and should not be restarted.

        It deliberately does **not** consult dependencies: a database outage
        must not cause an orchestrator to kill every Pivot pod, which would
        turn a recoverable dependency failure into a total outage.
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                version: 1.0.0

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Reports whether this instance should receive traffic. Fails while the
        instance is shutting down, and whenever a registered dependency check
        fails.
      security: []
      responses:
        "200":
          description: Ready for traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready — shutting down, or a dependency is failing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: not_ready
                version: 1.0.0
                checks:
                  database: "error: connection refused"

  /api/v1/auth/providers:
    get:
      tags: [sso]
      operationId: listAuthProviders
      summary: The single sign-on buttons a login page should offer
      description: |
        Unauthenticated by necessity: the login page needs these before anyone
        has a session. It therefore returns the slug and display name and
        nothing else — issuer and client id are not secret, but publishing an
        organization's vendor relationships to anonymous callers buys nothing.

        An unresolvable organization returns an empty list rather than an
        error, which is true and reveals nothing about which organizations
        exist.
      security: []
      parameters:
        - name: organization
          in: query
          required: false
          schema:
            type: string
          description: |
            Organization slug. May be omitted when the instance hosts exactly
            one organization.
      responses:
        "200":
          description: The providers to offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderList"

  /api/v1/auth/oidc/{provider}/start:
    get:
      tags: [sso]
      operationId: startSSO
      summary: Begin a single sign-on login
      description: |
        Redirects the browser to the identity provider, and sets a short-lived
        `HttpOnly` cookie holding this login's `state`, `nonce` and PKCE
        verifier.

        That cookie is `SameSite=Lax` and must be: the callback is a top-level
        navigation *from the identity provider's origin*, and `Strict` would
        withhold the cookie there and break every login.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: organization
          in: query
          required: false
          schema:
            type: string
        - name: return
          in: query
          required: false
          schema:
            type: string
          description: |
            Where to send the browser after the session exists. **Only a
            same-site absolute path is honored.** An absolute URL, a
            protocol-relative `//host`, or anything a browser might normalize
            into one is dropped — an open redirect on the login path is what
            turns a phishing link into a convincing one.
      responses:
        "302":
          description: Redirect to the identity provider
          headers:
            Location:
              schema:
                type: string
        "404":
          description: |
            No such provider. A disabled provider is deliberately
            indistinguishable from one that does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/oidc/{provider}/callback:
    get:
      tags: [sso]
      operationId: completeSSO
      summary: Complete a single sign-on login
      description: |
        Verifies the returned `state` against the flow cookie, redeems the
        authorization code, verifies the ID token, provisions or resolves the
        user, and issues a Pivot session — the same session a password login
        produces.

        The flow cookie is cleared whatever the outcome: a login is single-use,
        and leaving it behind invites a replay.

        Responds with a redirect for a browser, or the session envelope when
        the caller asks for `application/json`.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "302":
          description: Signed in; the browser is redirected onward
        "401":
          description: |
            The login could not be verified. Every reason returns this same
            answer — which step of a token's validation failed is of interest
            to an attacker and to nobody else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Verified, but not allowed an account here — provisioning is off,
            the account is disabled, or the provider sent no verified address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organization/identity-providers:
    get:
      tags: [sso]
      operationId: listIdentityProviders
      summary: The organization's configured identity providers
      description: |
        Requires `manage_organization`. Pointing an organization at a different
        directory is deciding who its users are, which is the same power as
        granting roles by another route.

        **`clientSecret` is never returned**, to an administrator or anyone
        else. `hasClientSecret` says whether one is configured.
      responses:
        "200":
          description: The configured providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [sso]
      operationId: createIdentityProvider
      summary: Configure an identity provider
      description: Requires `manage_organization`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderRequest"
      responses:
        "201":
          description: Configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organization/identity-providers/{id}:
    put:
      tags: [sso]
      operationId: updateIdentityProvider
      summary: Change an identity provider
      description: |
        Requires `manage_organization`.

        An omitted `clientSecret` keeps the stored one. That is what makes a
        write-only field usable: an administration screen reads the provider,
        edits the name, and writes it back without ever having seen the secret
        and without blanking it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      tags: [sso]
      operationId: deleteIdentityProvider
      summary: Remove an identity provider
      description: Requires `manage_organization`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/roles:
    get:
      tags: [authorization]
      operationId: listRoles
      summary: The built-in roles and what each may do
      description: |
        Readable by any authenticated caller: which roles exist and what they
        mean is documentation, and a role picker needs it. Who *holds* a role
        is a different question, answered by the role-assignments endpoint,
        which is gated.

        `native_query` appears on Analyst and not on Editor deliberately. Raw
        SQL bypasses semantic row-level security, so it is a separate grant
        rather than something bundled into "can edit".
      responses:
        "200":
          description: The role catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/organization/role-assignments:
    get:
      tags: [authorization]
      operationId: listRoleAssignments
      summary: Who holds which role
      description: Requires `manage_roles`.
      responses:
        "200":
          description: Every role assignment in the caller's organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags: [authorization]
      operationId: grantRole
      summary: Give a user or group a role
      description: |
        Requires `manage_roles` — which is, deliberately, the most dangerous
        permission in the API: whoever holds it can grant it to themselves.

        Granting the same role twice is a no-op. A subject that does not exist
        in the caller's organization is refused as a validation failure rather
        than stored as a dangling row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRoleRequest"
      responses:
        "201":
          description: The role was granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/organization/role-assignments/{subjectType}/{subjectId}/{role}:
    delete:
      tags: [authorization]
      operationId: revokeRole
      summary: Take a role away
      description: |
        Requires `manage_roles`.

        Removing the **last** administrator is refused: an organization with
        nobody who can grant roles is recoverable only from the command line,
        and the people most likely to reach that state are the least likely to
        have shell access. `pivot admin grant-role` is that recovery path.
      parameters:
        - name: subjectType
          in: path
          required: true
          schema:
            type: string
            enum: [user, group]
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The role was revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The request was rejected — most usefully, because this is the last
            administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/admin/sessions/{id}:
    delete:
      tags: [authorization]
      operationId: revokeAnySession
      summary: End any session in the organization
      description: |
        Requires `manage_sessions`. This is the administrative counterpart to
        `DELETE /api/v1/auth/sessions/{id}`, which only ever ends the caller's
        own: scoped to the organization rather than to one user, it is the
        right power for responding to a compromise and the wrong one for
        managing your own devices, which is why they are separate endpoints
        with separate permissions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pivot_session
      description: |
        Server-side session. Stateless tokens are deliberately not used for
        browser sessions: they cannot be revoked before expiry, and "remove
        this person's access" has to mean now.

        Set by `POST /api/v1/auth/login` and sent automatically by the
        browser. It is `HttpOnly`, so no client code reads or writes it.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          examples: [ada@example.com]
        password:
          type: string
          format: password
          maxLength: 1024
        organization:
          type: string
          maxLength: 100
          description: |
            The organization slug to authenticate against. May be omitted when
            the instance hosts exactly one organization, which is the
            self-hosted case. With several it is required — defaulting to one
            of them would authenticate people against a tenant they never
            named.
          examples: [acme]

    User:
      type: object
      required: [id, organizationId, email, name, locale, timezone, isActive]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
        locale:
          type: string
          examples: [en]
        timezone:
          type: string
          examples: [UTC]
        isActive:
          type: boolean

    Session:
      type: object
      required: [id, issuedAt, expiresAt, absoluteExpiresAt, lastSeenAt, current]
      properties:
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            The idle expiry. It moves forward as the session is used.
        absoluteExpiresAt:
          type: string
          format: date-time
          description: |
            The hard cap. Never extended, so an actively used session still
            ends — without it, a stolen token stays valid indefinitely as long
            as the thief keeps using it.
        lastSeenAt:
          type: string
          format: date-time
        ip:
          type: string
        userAgent:
          type: string
        current:
          type: boolean
          description: Whether this is the session making the request.

    SessionEnvelope:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
        permissions:
          type: array
          description: |
            What the caller may do in their organization.

            **Advisory.** It exists so a UI can hide what it cannot do rather
            than letting someone discover it by being refused. Every endpoint
            enforces independently, so treating this list as the authority
            would be a mistake — and an omission from it is never a way in.

            Present on `/auth/me`, absent from the login response.
          items:
            type: string
          examples: [[view_content, query]]

    AuthProvider:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          examples: [okta]
        name:
          type: string
          examples: [Okta]

    AuthProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"

    ClaimMapping:
      type: object
      description: |
        Which claim means what. Identity providers disagree about names, so
        this is configuration rather than a constant. Omitted fields use the
        standard OpenID Connect names.
      properties:
        email:
          type: string
          examples: [email]
        emailVerified:
          type: string
          examples: [email_verified]
        name:
          type: string
        groups:
          type: string
          examples: [groups]
        attributes:
          type: object
          description: |
            Claim name to user-attribute key. Only the claims listed here are
            copied: a provider's token routinely carries things Pivot has no
            business storing.
          additionalProperties:
            type: string

    IdentityProvider:
      type: object
      required:
        [id, slug, name, kind, issuer, clientId, isEnabled, autoProvision,
         linkByEmail, defaultRole, version, hasClientSecret]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [oidc]
        issuer:
          type: string
          format: uri
        clientId:
          type: string
        scopes:
          type: array
          items:
            type: string
        isEnabled:
          type: boolean
        autoProvision:
          type: boolean
          description: Create a Pivot user on first login.
        linkByEmail:
          type: boolean
          description: |
            Adopt an existing local account whose **verified** address matches,
            on first login. **Off by default, and meant to stay off outside a
            migration.** Directories reassign addresses, and with this on the
            next holder of an address inherits the previous holder's account.
        defaultRole:
          type: string
        claimMapping:
          $ref: "#/components/schemas/ClaimMapping"
        version:
          type: integer
          format: int64
        hasClientSecret:
          type: boolean
          description: |
            Whether a client secret is configured, without saying what it is.
            There is no read path for the secret itself.

    IdentityProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/IdentityProvider"

    IdentityProviderRequest:
      type: object
      required: [slug, name, issuer, clientId]
      properties:
        slug:
          type: string
          maxLength: 100
          description: URL segment; lowercase letters, digits and hyphens.
        name:
          type: string
        issuer:
          type: string
          format: uri
          description: |
            Must be an `https` URL, or `http` on a loopback host for a local
            provider.
        clientId:
          type: string
        clientSecret:
          type: string
          format: password
          description: |
            **Write-only.** Omit on update to keep the stored value. May be
            empty: PKCE is always used, so a provider configured as a public
            client needs no secret.
        scopes:
          type: array
          items:
            type: string
        isEnabled:
          type: boolean
        autoProvision:
          type: boolean
        linkByEmail:
          type: boolean
        defaultRole:
          type: string
          enum: [admin, editor, analyst, viewer]
        claimMapping:
          $ref: "#/components/schemas/ClaimMapping"
        version:
          type: integer
          format: int64
          description: Required on update, for optimistic concurrency.

    RoleDescription:
      type: object
      required: [role, permissions]
      properties:
        role:
          type: string
          examples: [analyst]
        permissions:
          type: array
          items:
            type: string

    RoleCatalog:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleDescription"

    RoleAssignment:
      type: object
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          type: string
          enum: [user, group]
          description: |
            A `group` assignment is a userset: every member of that group holds
            the role, including members of groups nested beneath it.
        subjectId:
          type: string
          format: uuid
        role:
          type: string
          examples: [admin]
        grantedAt:
          type: string
          format: date-time

    RoleAssignmentList:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"

    GrantRoleRequest:
      type: object
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          type: string
          enum: [user, group]
        subjectId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, editor, analyst, viewer]

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          description: One of `ok`, `not_ready`, or `shutting_down`.
          examples: [ok]
        version:
          type: string
          description: The running build's version.
        checks:
          type: object
          description: Per-dependency results. Present only on the readiness probe.
          additionalProperties:
            type: string

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
          description: The offending field, for validation failures.
          examples: [email]
        message:
          type: string
          examples: [is required]

    ErrorBody:
      type: object
      required: [code, message, docs]
      properties:
        code:
          type: string
          pattern: "^PIVOT-[A-Z]+-[0-9]{3}$"
          description: |
            A stable, machine-readable identifier. Independent of the HTTP
            status: the status says how the transport should behave, the code
            says what went wrong. Branch on this, never on the message.
          examples: [PIVOT-REQ-003]
        message:
          type: string
          description: A human-readable explanation. May change; do not parse it.
        details:
          type: array
          description: Per-field problems, for validation failures.
          items:
            $ref: "#/components/schemas/ErrorDetail"
        requestId:
          type: string
          description: Correlation ID, echoed in the `X-Request-Id` header.
        docs:
          type: string
          format: uri
          description: Documentation for this error code.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication is required, or the tenant could not be resolved
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Authenticated, but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: A version conflict or a duplicate
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnprocessableEntity:
      description: The body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Rate limited. `Retry-After` gives the wait in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: |
        A dependency could not be reached. On a gated endpoint this means the
        authorization backend was unavailable, so the request was denied
        without a decision being made — deliberately distinguishable from 403,
        which means a decision was made and it was no.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: An unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

security:
  - sessionCookie: []
