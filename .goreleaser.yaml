# GoReleaser builds the binaries a release publishes.
#
# The container image is *not* built here. GoReleaser can do it, but its Docker
# support expects to copy a prebuilt binary into an image, and this Dockerfile
# also builds the frontend -- restructuring it to suit the release tool would
# make the thing we ship differ from the thing CI tests on every pull request.
# The image stays on buildx in .github/workflows/release.yml, which is the same
# path the Image job already proves works.
#
# `make release-snapshot` runs all of this locally without publishing anything.

version: 2

project_name: pivot

before:
  hooks:
    # The binary embeds web/dist. Without this the release would ship the
    # committed placeholder and serve "the frontend has not been built" to
    # everyone who downloaded it -- which would be a very quiet disaster,
    # because nothing would fail.
    - make web-build

builds:
  - id: pivot
    main: ./cmd/pivot
    binary: pivot

    env:
      # Static, so a binary downloaded onto any Linux runs. Possible only
      # because ADR-0003 chose modernc.org/sqlite: a cgo driver would have
      # meant a glibc dependency and a build per distribution.
      - CGO_ENABLED=0

    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

    flags:
      # Paths in panics and stack traces become relative, so a binary does not
      # leak the build machine's directory layout.
      - -trimpath

    ldflags:
      - -s -w
      - -X github.com/Mmd4LIFE/pivot/internal/version.version={{ .Version }}
      - -X github.com/Mmd4LIFE/pivot/internal/version.commit={{ .FullCommit }}
      - -X github.com/Mmd4LIFE/pivot/internal/version.date={{ .CommitDate }}
      - -X github.com/Mmd4LIFE/pivot/internal/version.builtBy=goreleaser

    # The commit's own date rather than the build's, so building the same tag
    # twice produces identical bytes. Reproducibility is what makes a signature
    # worth checking.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: pivot
    ids: [pivot]

    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

    formats: [tar.gz]

    format_overrides:
      - goos: windows
        formats: [zip]

    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# A software bill of materials per archive, so anyone can see what is inside
# without unpacking and guessing. Generated by syft, which GoReleaser fetches.
sboms:
  - id: archives
    artifacts: archive

# Keyless signing, through Sigstore. No private key exists to leak or rotate:
# the signature is bound to the workflow identity that produced it, which is
# also a stronger claim than "somebody with the key signed this".
#
# Requires `id-token: write` in the workflow.
# The bundle format, which cosign 3 requires. The 2.x invocation
# (--output-signature and --output-certificate as separate files) is deprecated
# and now fails outright with "must specify --bundle with --new-bundle-format".
# A snapshot build is what caught that; it would otherwise have failed on the
# release itself, after the tag was already pushed.
#
# One bundle instead of two files: it carries the signature, the certificate
# and the transparency-log entry together, so verifying needs one download
# rather than three.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --new-bundle-format
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

changelog:
  # From the commit history, grouped. CHANGELOG.md stays the curated,
  # human-written record -- this is the generated list of what actually landed,
  # which is a different thing and worth having both.
  use: github
  sort: asc

  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

  groups:
    - title: Added
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixed
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 99

release:
  github:
    owner: Mmd4LIFE
    name: pivot

  # Anything with a hyphen in the version -- v0.0.1-alpha -- is marked
  # prerelease automatically, so an alpha never becomes the "latest" release
  # somebody's install script picks up.
  prerelease: auto

  header: |
    ## Pivot {{ .Tag }}

    Self-hostable business intelligence, as one binary or one container.

  footer: |
    ---

    ### Verifying what you downloaded

    Every archive is checksummed, and `checksums.txt` is signed with Sigstore.
    There is no public key to fetch: the signature is bound to the GitHub
    workflow that built it.

    ```
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --new-bundle-format \
      --certificate-identity-regexp 'https://github.com/Mmd4LIFE/pivot/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    Then check your download against `checksums.txt`:

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    The container image is signed the same way:

    ```
    cosign verify ghcr.io/mmd4life/pivot:{{ .Tag }} \
      --certificate-identity-regexp 'https://github.com/Mmd4LIFE/pivot/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
